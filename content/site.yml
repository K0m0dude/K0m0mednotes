title: "Ward round factfiles"
tagline: "Quick-reference notes for each rotation. Open a specialty to search and sort its conditions, or jump straight to one."
disclaimer: "**Study aid, not a prescribing guide.** Written from standard UK guidance (NICE, BTS/SIGN, Resuscitation Council UK, JBDS and similar). Doses and thresholds are for orientation. Always check the BNF and your trust's guidelines, and take your seniors' advice before acting on anything here."
footer: "**Reminder.** These notes are a revision aid and simplify complex guidance. Doses, thresholds and pathways change and vary between hospitals. Check the BNF, current NICE, BTS/SIGN, Resuscitation Council UK and JBDS guidance, and your trust's protocols. Cross-check against the Oxford Handbooks and your other textbooks through your university library."
