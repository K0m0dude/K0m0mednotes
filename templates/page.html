<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="{{spec_description_attr}}">
<title>{{page_title}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="page-spec">
<div class="wrap">
<header class="top">
  <a class="back" href="index.html">All specialties</a>
  <h1>{{page_title}}</h1>
  <p class="lede">{{spec_description}}</p>
  <p class="disc">{{disclaimer}}</p>
</header>

<div class="bar" role="search">
  <input id="q" type="search" placeholder="Search conditions, drugs, scores (e.g. CURB-65, terlipressin)" aria-label="Search factfiles">
  <label class="sortl" for="sort">Sort by
    <select id="sort">
      <option value="orig">List order</option>
      <option value="cat">Category</option>
      <option value="az">A to Z</option>
    </select>
  </label>
  <button id="openAll" type="button">Expand all</button>
  <button id="closeAll" type="button">Collapse all</button>
  <div class="count" id="count" aria-live="polite"></div>
</div>

<nav class="index" id="index" aria-label="Jump to a condition"></nav>
<div class="legend" aria-hidden="true">{{legend}}</div>

<main id="main" data-cats="{{cats_json}}">
{{cards}}
<div class="none" id="none">No factfiles match your search. Try a shorter term or a drug or condition name.</div>
</main>

<footer>
  <p>{{footer}}</p>
</footer>
</div>
<script src="assets/factfile.js"></script>
</body>
</html>
